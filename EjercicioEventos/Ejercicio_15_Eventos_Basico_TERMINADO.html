<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">
<html xmlns="http://w3.org">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Ejercicio 15 - Base Inicial</title>
    <style type="text/css">
        body {
            font-family: arial, helvetica;
        }

        #info {
            width: 160px;
            border: thin solid silver;
            padding: .5em;
            position: fixed;
            background-color: #fcfcfc;
        }

        #info h1 {
            margin: 0;
            font-size: 1.2em;
        }
    </style>
    <script type="text/javascript">
        /**
         * Añadimos un evento en la ventana que detecta cuando el ratón se mueve. 
         */
        window.addEventListener('mousemove', (evento) => {
            //Coordenadas X e Y.
            let coordenadaX = evento.screenX;
            let coordenadaY = evento.screenY;

            //Mostramos las coordenadas en el cuadro de texto.
            let parrafo = document.getElementById('p');
            parrafo.textContent = `Coordenada X: ${coordenadaX} \n Coordenada Y: ${coordenadaY}`;

            //Y modificamos el color del fondo para cuando mueva el ratón se ponga de color blanco.
            const info = document.getElementById('info');
            info.style.backgroundColor = '#FFFFFF';
        });

        /**
         * Añadimos un evento en la ventana que detecta cuando se pulsa una tecla. 
         */
        window.addEventListener('keypress', (evento) => {
            //Variable que lee la tecla pulsada.
            let tecla = String.fromCharCode(evento.charCode);

            //Mostramos la tecla pulsada en el cuadro de texto.
            let parrafo = document.getElementById('p');
            parrafo.textContent = `Tecla pulsada: ${tecla}`;

            //Si se pulsa una tecla se modifica el color del fondo del cuadro de texto a azul.
            const info = document.getElementById('info');
            info.style.backgroundColor = '#CCE6FF';
        });
        /**
        * Añadimos un evento en la ventana que detecta cuando se clickea con el ratón. 
        */
        window.addEventListener('click', (evento) => {
            //Si se hace click se modifica el color del fondo del cuadro de texto a amarillo.
            const info = document.getElementById('info');
            info.style.backgroundColor = '#FFFFCC';
        });
    </script>
</head>

<body>
    <div id="info">
        <h1>Información</h1>
        <p id="p">Mueve el ratón o pulsa una tecla para ver los detalles del evento.</p>
    </div>

    <div style="height: 1000px;"></div> <!-- Espacio para poder hacer scroll y probar pageX/pageY -->
</body>

</html>
