  <title>Ejercicio regex 5</title>

<body>
  <h1>Encontrar caracteres que no son dígitos</h1>
  <p>Obtén el primer carácter de &quot;a1b2&quot; que no sea un dígito.</p>
  <script>
    const texto = "a1b2";
    const x = texto.match(/\D/);
    console.log(x);
  </script>
